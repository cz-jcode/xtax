version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # CodeQL init and analyze must always use the same version.
      codeql:
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
      - github-actions
