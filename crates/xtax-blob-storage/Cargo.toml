[package]
name = "xtax-blob-storage"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Application-level blob storage abstraction with filesystem/S3 backends, optional encryption, rekey, cleanup, and background maintenance."
documentation = "https://docs.rs/xtax-blob-storage"
readme = "README.md"
keywords = ["blob", "storage", "s3", "filesystem", "encryption"]
categories = ["filesystem", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["fs"]
fs = ["tokio/fs"]
s3 = ["dep:aws-sdk-s3", "dep:aws-smithy-types", "dep:aws-config"]

[dependencies]
xtax-encryption = { version = "0.1.3", path = "../xtax-encryption" }
async-trait = "0.1.92"
tracing = { version = "0.1.44", features = ["attributes"] }
tokio = { version = "1.54.1", features = ["io-util", "rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

aws-sdk-s3 = {
    version = "1.157.0",
    optional = true,
    default-features = false,
    features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"],
}
aws-smithy-types = { version = "1.9.1", optional = true }
aws-config = { version = "1.13.0", optional = true }

chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
bytes = "1.12.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "io-util"] }
tempfile = "3.27.0"
tracing = "0.1.44"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }

aws-sdk-s3 = {
    version = "1.157.0",
    default-features = false,
    features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"],
}
s3s = "0.17.0"
s3s-fs = "0.17.0"
s3s-aws = "0.17.0"
